[package]
name = "kseal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for kseal"

[[bin]]
name = "kseal"
path = "src/main.rs"

[dependencies]
kseal = { workspace = true }
kseal-google-cloud = { workspace = true }

argh = { workspace = true }
kdl = { workspace = true, features = ["serde"] }
rand = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
zeroize = { workspace = true }
